# Independent Hytale AI NPC learning stack
# Brain + local Qwen (Ollama) live under this project folder.
# Hytale stays on the Windows host.

services:
  # Local Qwen weights are stored in ./models/ollama (inside hytale-pest-npc)
  ollama:
    image: ollama/ollama:latest
    container_name: hytale-pest-npc-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./models/ollama:/root/.ollama
    environment:
      # Keep models under the project bind-mount
      OLLAMA_MODELS: /root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hytale-pest-npc-brain
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    ports:
      - "${BRAIN_PORT:-8766}:8766"
      - "${API_PORT:-8780}:8780"
    env_file:
      - .env
    environment:
      HYTALE_MOUNT: /hytale
      DATA_DIR: /data
      BRAIN_HOST: "0.0.0.0"
      BRAIN_PORT: "8766"
      API_PORT: "8780"
      SIM_MODE: ${SIM_MODE:-0}
      # Local Qwen via project Ollama (preferred — no cloud Grok)
      # 3b = much faster on CPU; use qwen2.5:7b only if you have a GPU
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      # Cloud LLM optional only (leave empty for local Qwen)
      XAI_API_KEY: ${XAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - ./data:/data
      # Set HYTALE_HOST_PATH in .env (Windows: C:/Users/YOU/AppData/Roaming/Hytale)
      - type: bind
        source: ${HYTALE_HOST_PATH}
        target: /hytale
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8780/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
